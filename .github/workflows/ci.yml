name: CI

on:
  push:
    branches: [engenharia-dados, develope]
  pull_request:
    branches: [engenharia-dados, develope]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"

      - name: Verificar estilo
        run: python -m ruff check src tests

      # Não executa pipeline/validate_project.py: data/silver não é versionada.
      - name: Executar testes
        run: python -m pytest

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"

      - name: Verificar formatacao
        run: terraform fmt -check -recursive

      - name: Inicializar sem backend
        run: terraform init -backend=false -input=false

      - name: Validar configuracao
        run: terraform validate
